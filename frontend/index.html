<!DOCTYPE html>
<html lang="ar" dir="rtl" data-bs-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>وصفات الحلويات</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <!-- 1. الشريط العلوي -->
  <header>
    <nav class="navbar app-navbar">
      <div class="container d-flex justify-content-between">
        <h1 class="navbar-brand mb-0 fs-4 fw-bold">🍰 وصفات الحلويات</h1>
        
      </div>
    </nav>
  </header>

  <main>
    <div class="container py-4 py-lg-5">

     

      <!-- 2. البحث والفلترة -->
      <div class="card toolbar p-3 mb-4 shadow-sm">
        <div class="row g-3 align-items-center">
          <div class="col-12 col-lg-5">
            <label for="searchInput" class="visually-hidden">ابحث باسم الوصفة</label>
            <input type="search" id="searchInput" class="form-control" placeholder="🔍  ابحث باسم الوصفة..." autocomplete="off">
          </div>
          <div class="col-12 col-lg-7">
            <div id="categoryChips" class="d-flex flex-wrap gap-2" role="group" aria-label="فلترة حسب النوع">
              <button type="button" class="btn chip active" data-category="">الكل</button>
            </div>
          </div>
        </div>
      </div>

      <!-- أزرار الإضافة -->
      <div class="d-flex flex-wrap gap-2 mb-4">
        <button id="addRecipeBtn" type="button" class="btn btn-primary">＋ إضافة وصفة</button>
        <button id="addCategoryBtn" type="button" class="btn btn-outline-primary">＋ إضافة نوع</button>
        <button id="deleteCategoryBtn" type="button" class="btn btn-outline-danger ms-auto">🗑 حذف نوع</button>
      </div>

      <!-- مؤشر التحميل -->
      <div id="loadingSpinner" class="text-center d-none my-4">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">جاري التحميل...</span>
        </div>
      </div>

      <!-- رسالة الخطأ -->
      <div id="errorAlert" class="alert alert-danger alert-dismissible fade show d-none" role="alert">
        <span id="alertMessage"></span>
        <button type="button" class="btn-close" onclick="hideAlert()" aria-label="إغلاق"></button>
      </div>

      <!-- 3. عدد النتائج -->
      <p id="resultsCount" class="text-secondary mb-3"></p>

      <!-- 4. بطاقات الوصفات -->
      <div id="recipesGrid" class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 row-cols-xl-4 g-3"></div>

      <!-- لا توجد نتائج -->
      <div id="emptyState" class="text-center py-5 d-none">
        <div class="display-1 mb-2">🧁</div>
        <h5 class="fw-bold">لا يوجد</h5>
      </div>
    </div>
  </main>

  <!-- نافذة تفاصيل الوصفة -->
  <div class="modal fade" tabindex="-1" id="recipeModal" aria-labelledby="recipeModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <div>
            <h5 class="modal-title fw-bold" id="recipeModalTitle"></h5>
            <span id="recipeModalCategory" class="badge category-badge mt-1"></span>
          </div>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="إغلاق"></button>
        </div>
        <div class="modal-body" id="recipeModalBody"></div>
        <div class="modal-footer">
          <button type="button" id="editRecipeBtn" class="btn btn-outline-primary" disabled>✏️ تعديل الوصفة</button>
          <button type="button" id="deleteRecipeBtn" class="btn btn-outline-danger" disabled>🗑 حذف الوصفة</button>
        </div>
      </div>
    </div>
  </div>

  <!-- نافذة إضافة نوع -->
  <div class="modal fade" tabindex="-1" id="categoryModal" aria-labelledby="categoryModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <form class="modal-content" id="categoryForm" novalidate>
        <div class="modal-header">
          <h5 class="modal-title fw-bold" id="categoryModalTitle">إضافة نوع جديد</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="إغلاق"></button>
        </div>
        <div class="modal-body">
          <div id="categoryFormError" class="alert alert-danger d-none"></div>
          <label for="categoryName" class="form-label">اسم النوع<span class="text-danger">*</span></label>
          <input type="text" id="categoryName" class="form-control" maxlength="50" placeholder="مثال: حلويات رمضانية" required>
          <div class="invalid-feedback">اسم النوع مطلوب.</div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-primary">حفظ</button>
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">إلغاء</button>
        </div>
      </form>
    </div>
  </div>

  <!-- نافذة إضافة وصفة -->
  <div class="modal fade" tabindex="-1" id="addRecipeModal" aria-labelledby="addRecipeModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-lg">
      <form class="modal-content" id="recipeForm" novalidate>
        <div class="modal-header">
          <h5 class="modal-title fw-bold" id="addRecipeModalTitle">إضافة وصفة جديدة</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="إغلاق"></button>
        </div>
        <div class="modal-body">
          <div id="recipeFormError" class="alert alert-danger d-none"></div>
          <div class="row g-3 mb-3">
            <div class="col-12 col-md-7">
              <label for="recipeName" class="form-label">اسم الوصفة<span class="text-danger">*</span></label>
              <input type="text" id="recipeName" class="form-control" maxlength="100" required>
              <div class="invalid-feedback">اسم الوصفة مطلوب.</div>
            </div>
            <div class="col-12 col-md-5">
              <label for="recipeCategory" class="form-label">النوع<span class="text-danger">*</span></label>
              <select id="recipeCategory" class="form-select" required></select>
              <div class="invalid-feedback">اختار النوع.</div>
            </div>
          </div>

          <label class="form-label">المكونات<span class="text-danger">*</span></label>
          <div id="ingredientRows" class="d-grid gap-2 mb-2"></div>
          <div class="mb-3"><button type="button" id="addIngredientBtn" class="btn btn-sm btn-outline-secondary">＋ إضافة مكون</button></div>

          <label for="recipeInstructions" class="form-label">طريقة التحضير<span class="text-danger">*</span></label>
          <textarea id="recipeInstructions" class="form-control" rows="6" required
                    placeholder="اكتبي كل خطوة في سطر مستقل"></textarea>
          <div class="invalid-feedback">طريقة التحضير مطلوبة.</div>
        </div>
        <div class="modal-footer">
          <button type="submit" id="recipeSubmitBtn" class="btn btn-primary">حفظ الوصفة</button>
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">إلغاء</button>
        </div>
      </form>
    </div>
  </div>

  <!-- نافذة حذف نوع -->
  <div class="modal fade" tabindex="-1" id="deleteCategoryModal" aria-labelledby="deleteCategoryModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <form class="modal-content" id="deleteCategoryForm" novalidate>
        <div class="modal-header">
          <h5 class="modal-title fw-bold" id="deleteCategoryModalTitle">حذف نوع</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="إغلاق"></button>
        </div>
        <div class="modal-body">
          <div id="deleteCategoryError" class="alert alert-danger d-none"></div>
          <label for="deleteCategorySelect" class="form-label">اختار النوع الذي تريدي حذفه</label>
          <select id="deleteCategorySelect" class="form-select" required></select>
          <div class="invalid-feedback">اختار النوع.</div>
          <p class="text-secondary small mt-2 mb-0">يمكن حذف النوع فقط إذا لم يكن فيه أي وصفة.</p>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-danger">حذف</button>
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">إلغاء</button>
        </div>
      </form>
    </div>
  </div>

  <!-- نافذة التأكيد -->
  <div class="modal fade" tabindex="-1" id="confirmModal" aria-labelledby="confirmModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold" id="confirmModalTitle">تأكيد الحذف</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="إغلاق"></button>
        </div>
        <div class="modal-body" id="confirmMessage"></div>
        <div class="modal-footer">
          <button type="button" id="confirmOkBtn" class="btn btn-danger">نعم، حذف</button>
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">إلغاء</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <div id="toastBox" class="app-toast" role="status" aria-live="polite"></div>
</body>

</html>
